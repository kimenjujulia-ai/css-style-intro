<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Splash Screen Demo</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #14213d;
    --paper: #f7f3ea;
    --accent: #ff5d3a;
    --splash-bg: #14213d;
  }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: 'Inter', sans-serif; background: var(--paper); color: var(--ink); }
 
  /* ---------- SPLASH SCREEN ---------- */
  #splash {
    position: fixed; inset: 0; z-index: 999;
    display: grid; place-items: center;
    background: var(--splash-bg);
    color: var(--paper);
  }
  /* two panels that slide apart like curtains */
  #splash::before, #splash::after {
    content: ""; position: absolute; top: 0; bottom: 0; width: 50%;
    background: var(--splash-bg); z-index: -1;
    transition: transform 0.9s cubic-bezier(.77,0,.18,1);
  }
  #splash::before { left: 0; }
  #splash::after  { right: 0; }
  #splash { background: transparent; }
 
  .splash-inner { text-align: center; transition: opacity 0.4s ease; }
  .logo {
    font-family: 'Fraunces', serif; font-weight: 600;
    font-size: clamp(2.5rem, 10vw, 6rem);
    letter-spacing: 0.02em; margin: 0;
  }
  .logo span {
    display: inline-block; opacity: 0; transform: translateY(40px);
    animation: letterUp 0.6s cubic-bezier(.2,.8,.2,1) forwards;
  }
  .logo span:nth-child(1) { animation-delay: 0.10s; }
  .logo span:nth-child(2) { animation-delay: 0.18s; }
  .logo span:nth-child(3) { animation-delay: 0.26s; }
  .logo span:nth-child(4) { animation-delay: 0.34s; }
  .logo span:nth-child(5) { animation-delay: 0.42s; }
 
  .bar { width: min(260px, 60vw); height: 3px; margin: 1.5rem auto 0; background: rgba(255,255,255,.2); overflow: hidden; }
  .bar i { display: block; height: 100%; width: 0; background: var(--accent); animation: load 1.8s ease forwards 0.3s; }
 
  /* when finished: text fades, curtains open */
  #splash.done .splash-inner { opacity: 0; }
  #splash.done::before { transform: translateX(-100%); }
  #splash.done::after  { transform: translateX(100%); }
  #splash.gone { display: none; }
 
  @keyframes letterUp { to { opacity: 1; transform: translateY(0); } }
  @keyframes load { to { width: 100%; } }
 
  /* ---------- YOUR HOME PAGE ---------- */
  main { min-height: 100vh; display: grid; place-items: center; text-align: center; padding: 2rem; }
  main h1 { font-family: 'Fraunces', serif; font-size: clamp(2.2rem, 7vw, 5rem); margin: 0 0 1rem; }
  main p { max-width: 38ch; margin: 0 auto 1.5rem; font-size: 1.1rem; line-height: 1.5; }
  button.replay {
    font: inherit; padding: .8rem 1.6rem; border: 2px solid var(--ink); background: transparent;
    color: var(--ink); border-radius: 50px; cursor: pointer; transition: .25s;
  }
  button.replay:hover, button.replay:focus-visible { background: var(--ink); color: var(--paper); }
 
  @media (prefers-reduced-motion: reduce) {
    .logo span, .bar i { animation-duration: 0.01s; animation-delay: 0s; }
    #splash::before, #splash::after { transition-duration: 0.01s; }
  }
</style>
</head>
<body>
 
<!-- 1. THE SPLASH SCREEN -->
<div id="splash" role="status" aria-label="Loading">
  <div class="splash-inner">
    <h1 class="logo"><span>M</span><span>y</span><span>S</span><span>i</span><span>te</span></h1>
    <div class="bar"><i></i></div>
  </div>
</div>
 
<!-- 2. YOUR REAL HOME PAGE -->
<main>
  <div>
    <h1>Welcome in.</h1>
    <p>This is your actual home page, revealed after the splash screen opens.</p>
    <button class="replay" onclick="playSplash()">Replay intro</button>
  </div>
</main>
 
<script>
  const splash = document.getElementById('splash');
 
  function playSplash() {
    // restart animations by cloning the splash content
    splash.classList.remove('done', 'gone');
    const inner = splash.querySelector('.splash-inner');
    const fresh = inner.cloneNode(true);
    inner.replaceWith(fresh);
    document.body.style.overflow = 'hidden';
 
    setTimeout(() => splash.classList.add('done'), 2400);   // start the reveal
    setTimeout(() => {                                      // remove it fully
      splash.classList.add('gone');
      document.body.style.overflow = '';
    }, 3400);
  }
 
  // skip on click (good manners for repeat visitors)
  splash.addEventListener('click', () => splash.classList.add('done'));
 
  playSplash();
</script>
</body>
</html>
